server {
    listen 80;
    server_name localhost;

    location /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location /artifacts/ {
        alias /var/www/artifacts/;
        autoindex on;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }
}
