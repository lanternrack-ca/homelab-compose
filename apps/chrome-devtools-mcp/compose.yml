services:
  web:
    image: nginx:alpine
    container_name: \chrome-devtools-mcp-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT}:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./artifacts:/var/www/artifacts:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  chrome-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: \${IMG:-chrome-devtools-mcp:latest}
    container_name: \chrome-devtools-mcp-app
    restart: unless-stopped
    init: true
    ipc: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./artifacts:/home/node/artifacts
    working_dir: /home/node
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
