services:
  seerr:
    container_name: seerr-app
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    ports:
      - "${PORT}:5055"
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - jellyfin
    networks:
      - seerr

  jellyfin:
    container_name: seerr-jellyfin
    image: jellyfin/jellyfin:latest
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "${JF_PORT}:8096"
    environment:
      - TZ=${TZ}
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - ./media:/media
    networks:
      - seerr

networks:
  seerr:
    name: seerr-net
