services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:${SPEEDTEST_TAG:-v1.15.1-ls180}
    container_name: speedtest-tracker-server
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${SPEEDTEST_PORT:-3000}:80"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DB_CONNECTION: sqlite
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-UTC}
      PUBLIC_DASHBOARD: ${PUBLIC_DASHBOARD:-true}
      SPEEDTEST_SCHEDULE: ${SPEEDTEST_SCHEDULE:-0 * * * *}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/api/healthcheck || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s
networks:
  default:
    name: speedtest-tracker-net
