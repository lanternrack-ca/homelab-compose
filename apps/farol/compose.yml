services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    container_name: farol-web
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./reports:/usr/share/nginx/html/reports:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  farol:
    build:
      context: ..
      dockerfile: deploy/web/cli.Dockerfile
    container_name: farol-cli
    working_dir: /workspace
    volumes:
      - ../repo:/workspace:ro
    profiles:
      - cli-tools
