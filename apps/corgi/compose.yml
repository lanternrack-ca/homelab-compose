services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corgi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CORGI_WEB_PORT}:4400"
    environment:
      - PORT=4400
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
