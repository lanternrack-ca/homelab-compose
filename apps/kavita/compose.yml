services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita-web
    restart: unless-stopped
    ports:
      - "${KAVITA_PORT:-5000}:5000"
    environment:
      - TZ=UTC
    volumes:
      - ./config:/kavita/config
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
