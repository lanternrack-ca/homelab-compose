services:
  qbittorrent:
    container_name: qbittorrent-app
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
      - "${PEER_PORT}:6881"
      - "${PEER_PORT}:6881/udp"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/app/version -o /dev/null -w '%{http_code}' | grep -qE '200|403'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - qbt

networks:
  qbt:
    name: qbittorrent-net
