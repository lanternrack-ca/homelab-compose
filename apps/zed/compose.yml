services:
  blob_store:
    image: cleanstart/minio:latest
    container_name: zed-blob-store
    command: server /data --console-address ":9001"
    user: "0:0"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9010}:9000"
      - "127.0.0.1:${WEB_PORT:-3000}:9001"
    environment:
      MINIO_ROOT_USER: the-blob-store-access-key
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./blob_store:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  livekit_server:
    image: docker.io/livekit/livekit-server:latest
    container_name: zed-livekit-server
    entrypoint: /livekit-server --config /livekit.yaml
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./config/livekit.yaml:/livekit.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

networks:
  default:
    name: zed-network
