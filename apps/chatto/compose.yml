services:
  nats:
    image: nats:latest
    restart: unless-stopped
    command: ['--config', '/etc/nats/nats-server.conf', '--auth=${NATS_TOKEN}']
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data

  chatto:
    image: ghcr.io/chattocorp/chatto:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PUID: '${PUID:-1000}'
      PGID: '${PGID:-1000}'
    depends_on:
      - nats
    ports:
      - "${CHATTO_PORT}:4000"
    volumes:
      - ./backups:/backups
      - ./data:/data

volumes:
  nats_data:
