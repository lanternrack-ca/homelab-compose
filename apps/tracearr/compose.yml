services:
  tracearr:
    container_name: tracearr-app
    image: ghcr.io/connorgallopo/tracearr:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - TZ=${TZ:-UTC}
      - DATABASE_URL=postgres://tracearr:${DB_PASSWORD}@timescale:5432/tracearr
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CORS_ORIGIN=*
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - tracearr_backups:/data/backup
      - tracearr_images:/data/tracearr/image-cache
    networks:
      - tracearr

  timescale:
    container_name: tracearr-db
    image: timescale/timescaledb-ha:pg18.4-ts2.29.1
    restart: unless-stopped
    shm_size: 512mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: postgres -c timescaledb.license=timescale -c timescaledb.max_tuples_decompressed_per_dml_transaction=100000 -c max_locks_per_transaction=4096 -c timescaledb.telemetry_level=off -c max_connections=150
    environment:
      - POSTGRES_USER=tracearr
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=tracearr
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracearr -d tracearr"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tracearr

  redis:
    container_name: tracearr-redis
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tracearr

networks:
  tracearr:
    name: tracearr-net

volumes:
  tracearr_backups:
    name: tracearr-backups
  tracearr_images:
    name: tracearr-images
  timescale_data:
    name: tracearr-timescale-data
  redis_data:
    name: tracearr-redis-data
