services:
  listenarr:
    image: ghcr.io/listenarrs/listenarr:canary
    container_name: listenarr
    ports:
      - "4545:4545"
    environment:
      - PUID=${LA_UID}
      - PGID=${LA_GID}
      - UMASK=022
      - LISTENARR_LOG_LEVEL=Information
    volumes:
      - listenarr_data:/app/config
      - ${HOME}/listenarr/audiobooks:/audiobooks
      - ${HOME}/listenarr/downloads:/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  listenarr_data:
