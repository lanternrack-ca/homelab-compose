server {
    listen 443 ssl;
    server_name example.com localhost;

    ssl_certificate /certs/example.com/cert.pem;
    ssl_certificate_key /certs/example.com/key.pem;

    location / {
        default_type text/plain;
        return 200 "traefik-certs-dumper TLS extraction verified: Active SSL/TLS termination\n";
    }
}
