services:
  dispatcharr:
    image: ${IMAGE}
    container_name: dispatcharr-dispatcharr
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DISPATCHARR_PORT}:9191"
    volumes:
      - "./data:/data"
    environment:
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      - DISPATCHARR_PORT=9191
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9191/api/core/version/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
