services:
  lightpost:
    image: python:3.12-slim
    network_mode: host
    working_dir: /src
    volumes:
      - ${REPO}:/src:ro
      - lightpost-data:/data
      - lightpost-venv:/opt/venv
    environment:
      HOST: 127.0.0.1
      PORT: ${LP_PORT}
      DATABASE_PATH: /data/lightpost.sqlite
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command:
      - sh
      - -c
      - |
        set -e
        test -x /opt/venv/bin/python || python -m venv /opt/venv
        /opt/venv/bin/pip install -q -r requirements.txt
        exec /opt/venv/bin/python -m lightpost
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/api/session'%os.environ['PORT'],timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: "no"
volumes:
  lightpost-data:
  lightpost-venv:
