services:
  norish:
    image: norishapp/norish:latest
    container_name: norish-app
    restart: always            # required by the Admin UI's "restart server" feature
    ports:
      - "${NORISH_PORT:-3000}:3000"
    volumes:
      - norish_data:/app/uploads
    environment:
      AUTH_URL: ${AUTH_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/norish
      MASTER_KEY: ${MASTER_KEY}
      OBSCURA_ENDPOINT: ws://obscura:9222
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN}
      REDIS_URL: redis://redis:6379
      UPLOADS_DIR: /app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health', r => process.exit(r.statusCode===200?0:1))\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 2m
    depends_on:
      - db
      - redis
      - obscura

  db:
    image: postgres:17-alpine
    container_name: norish-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: norish
    volumes:
      - db_data:/var/lib/postgresql/data

  obscura:
    image: norishapp/obscura:0.2.4-norish.1
    container_name: norish-obscura
    restart: unless-stopped
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN}
    # no host port on purpose: anyone who can reach CDP can drive the browser

  redis:
    image: redis:8.10.1
    container_name: norish-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  db_data:
  norish_data:
  redis_data:
