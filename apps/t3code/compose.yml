services:
  t3code:
    image: t3code:latest
    container_name: t3code-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:5733"
    volumes:
      - ./repo:/workspace:rw
      - t3code-data:/home/t3user/.t3
    environment:
      - TERM=xterm-256color
      - HOST=0.0.0.0
      - PORT=5733
      - T3CODE_HOME=/home/t3user/.t3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5733/ || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

volumes:
  t3code-data:
    name: t3code-data
