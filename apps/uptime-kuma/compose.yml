services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3001"
    volumes:
      - ./data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
      - UPTIME_KUMA_DB_TYPE=sqlite
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || curl -f http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
