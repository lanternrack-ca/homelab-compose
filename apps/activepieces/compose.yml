services:
  app:
    image: ghcr.io/activepieces/activepieces:0.93.0
    container_name: activepieces-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=APP
      - AP_FRONTEND_URL=http://localhost:${HOST_PORT}
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 30s

  worker:
    image: ghcr.io/activepieces/activepieces:0.93.0
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    environment:
      - AP_CONTAINER_TYPE=WORKER
      - AP_FRONTEND_URL=http://app
    deploy:
      replicas: 1
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: activepieces-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${AP_POSTGRES_DATABASE}
      - POSTGRES_PASSWORD=${AP_POSTGRES_PASSWORD}
      - POSTGRES_USER=${AP_POSTGRES_USERNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - activepieces
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AP_POSTGRES_USERNAME} -d ${AP_POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7.0.7
    container_name: activepieces-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - activepieces
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

networks:
  activepieces:
