services:
  grimoire:
    image: hunterreadca/grimoire:latest
    container_name: grimoire-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:9481"
    environment:
      - LIBRARY_PATH=/library
      - DATA_PATH=/data
      - WORKERS=${WORKERS:-1}
      - SECRET_KEY=${SECRET_KEY}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - OPDS_ENABLED=${OPDS_ENABLED:-true}
    volumes:
      - ./library:/library
      - ./data:/data
