services:
  web:
    image: nginx:alpine
    container_name: herdr-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./telemetry:/var/www/telemetry:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  herdr:
    image: herdr:latest
    container_name: herdr-cli
    volumes:
      - ./telemetry:/telemetry
      - ./config:/home/herdruser/.config/herdr
      - ./state:/home/herdruser/.local/state/herdr
    environment:
      - TERM=xterm-256color
    restart: "no"
