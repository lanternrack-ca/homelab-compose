services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall-web
    restart: unless-stopped
    ports:
      - "${HEIMDALL_PORT:-80}:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
