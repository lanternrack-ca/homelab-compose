[global]
  e2dsa, e2ts      # index files + media tags (search, dedup, music metadata)
  ansi             # coloured logs
  hist: /cfg/hist  # keep the sqlite index and thumbnails in the cfg volume
  name: lanternrack-demo
  usernames        # login with username + password
  ah-alg: argon2   # passwords below are argon2 hashes
  ah-salt: CHANGE-ME-SALT

[accounts]
  ed: CHANGE-ME-HASH

[/]
  /w
  accs:
    r: *           # anyone can browse and stream
    rwmda: ed      # ed can upload, move, delete, admin
