services:
  scrapling-mcp:
    image: scrapling:latest
    container_name: scrapling-mcp
    restart: unless-stopped
    ipc: host
    shm_size: 2gb
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SCRAPLING_MCP_AUTH_TOKEN=${SCRAPLING_MCP_AUTH_TOKEN:?set SCRAPLING_MCP_AUTH_TOKEN in .env}
    command:
      - "mcp"
      - "--http"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--auth-token"
      - "scrapling-demo-token-20261115"
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import urllib.request, urllib.error, sys
          try:
              urllib.request.urlopen('http://127.0.0.1:8000/mcp')
              sys.exit(0)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code in (400, 401) else 1)
          except Exception:
              sys.exit(1)
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s

  web:
    image: nginx:alpine
    container_name: scrapling-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./telemetry:/var/www/telemetry:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - scrapling-mcp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 2s
