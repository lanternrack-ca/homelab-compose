services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_TAG:-2.45.3}
    container_name: portainer-server
    pull_policy: missing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      PORTAINER_SETUP_TOKEN: ${PORTAINER_SETUP_TOKEN:?setup token required}
    command: ["--http-enabled", "-H", "unix:///var/run/docker.sock"]
    ports:
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
      - "${PORTAINER_EDGE_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
networks:
  default:
    name: portainer-net
