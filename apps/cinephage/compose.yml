services:
  cinephage:
    image: ghcr.io/moldytaint/cinephage:${IMAGE_TAG:-0.17.0}
    container_name: cinephage
    restart: unless-stopped
    init: true
    # Headless Firefox (captcha solving) needs more than the 64MB /dev/shm default.
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      - ./config:/config
      - ./media:/media
      - ./downloads:/downloads
